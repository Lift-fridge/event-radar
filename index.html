<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101e2a"><link rel="apple-touch-icon" href="./apple-touch-icon-e-big.png"><link rel="icon" type="image/png" sizes="192x192" href="./icon-e-big-192.png"><link rel="icon" type="image/png" sizes="512x512" href="./icon-e-big-512.png"><title>EVENT RADAR｜試作版</title><style>
:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif}*{box-sizing:border-box}body{margin:0;background:#f4f6f4;color:#17282d}.wrap{max-width:780px;margin:auto;padding:24px 16px 80px}header{background:#10272d;color:white;border-radius:24px;padding:28px 24px;margin-bottom:22px}header small{font-size:12px;letter-spacing:.16em;color:#b9e1ce}header h1{font-family:Georgia,serif;font-size:clamp(32px,8vw,50px);letter-spacing:-.04em;margin:14px 0 8px}header h1 em{color:#9de6b4}header p{margin:0 0 16px;color:#d7e6de}header .note{font-size:12px;color:#b3cac1}nav{display:flex;gap:8px;margin:16px 0}button,select{font:inherit}nav button{border:1px solid #d1d9d3;background:#fff;border-radius:30px;padding:10px 18px;cursor:pointer}nav button.active{background:#183b3c;color:white}label{font-size:13px;color:#596a6a}select{display:block;margin:6px 0 22px;padding:10px 13px;border:1px solid #d0d9d4;background:white;border-radius:12px;max-width:100%}h2{font-size:23px;margin:20px 0 6px}.hint{font-size:12px;color:#647474;margin:0 0 20px}.card{background:white;border:1px solid #e1e8e2;border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 5px 20px #113a2110}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.pill{display:inline-block;background:#e9f2ed;color:#22654c;border-radius:20px;padding:6px 12px;font-size:12px}.date{margin-top:15px;color:#346256;font-weight:700;font-size:14px}.card h3{font-size:21px;margin:8px 0 6px}.card p{line-height:1.8;margin:0 0 12px}.heart{border:0;background:#f1f5f2;border-radius:50%;width:44px;height:44px;font-size:26px;color:#59716c;cursor:pointer}.heart.on{color:#c34968}.link{color:#12684e;text-decoration:none;font-weight:700;display:inline-block;padding:8px 0}footer{color:#667570;font-size:12px;line-height:1.8;margin-top:32px}.empty{padding:42px 20px;text-align:center;background:white;border-radius:18px;color:#60746d}dialog{width:min(580px,calc(100% - 22px));max-height:85vh;border:0;border-radius:20px;padding:24px;box-shadow:0 15px 70px #0005}dialog::backdrop{background:#09241eb9}dialog h2{margin:22px 0 12px}dialog p{line-height:1.8}.detail{border-top:1px solid #e2e9e6;padding:12px 0}.detail b{display:block;margin-bottom:4px;color:#48645a;font-size:13px}.close{float:right;border:0;background:#edf2ef;border-radius:50%;width:40px;height:40px;font-size:25px}.warn{color:#65726c;font-size:12px}
</style></head><body><div class="wrap"><header><small>DISCOVER WHAT'S NEXT · PROTOTYPE</small><h1>EVENT <em>RADAR</em> ✳</h1><p>まだ知らない、これからの楽しみに出会う。</p><div class="note">主要イベント＋意外な発見｜2026年10月23日確認データ｜自動更新なし</div></header><nav><button id="all" class="active">見つける</button><button id="fav">♡ お気に入り</button><button id="news">新着候補</button></nav><div id="filterArea"><label for="category">カテゴリー</label><select id="category"><option value="">すべて</option></select></div><h2 id="heading">これからのイベント</h2><p class="hint" id="listHint">開催日順・掲載前の検証用データ</p><main id="cards"></main><footer>EVENT RADAR Preview 0.1｜通知・データ自動更新は未実装です。開催日時・参加条件は変わることがあります。公式サイトをご確認ください。<br>お気に入りは、この端末のブラウザに保存されます。</footer></div><dialog id="dialog"><button class="close" id="close" aria-label="閉じる">×</button><div id="detail"></div></dialog><script>
(()=>{"use strict";const data=[{"id":"filmex","name":"第27回 東京フィルメックス","category":"映画・文化","kind":"主要イベント","date":"2026-11-20","end":"2026-11-29","time":"各作品ごとに異なる","place":"有楽町朝日ホールほか","access":"上映作品ごとの日時・チケットをご確認ください","why":"国内外の映画に出会える映画祭。知らなかった作品を見つけるきっかけになります。","trivia":"複数の会場を使い、作品によって上映日と時刻が異なります。","url":"https://filmex.jp/2026/about.html"},{"id":"fujikyu","name":"富士急電車まつり2026","category":"鉄道・お出かけ","kind":"意外な発見","date":"2026-11-28","end":"2026-11-28","time":"10:00〜16:00（予定）","place":"河口湖駅・富士山駅周辺・下吉田駅","access":"入場無料。一部の体験は有料・事前予約制","why":"普段は入れない鉄道の世界をのぞける、知っておきたいお出かけイベント。","trivia":"引退した車両の特別乗車体験などが予定されていました。","url":"https://www.fujikyu-railway.jp/news/info.php?no=1225"},{"id":"songs","name":"SONGSスペシャル Mrs. GREEN APPLE","category":"音楽・テレビ","kind":"主要イベント","date":"2026-10-29","end":"2026-10-29","time":"22:00〜22:45","place":"NHK総合・NHK ONE","access":"地上波放送。見逃し配信の有無・期限は公式情報をご確認ください","why":"フルオーケストラとの共演など、特別な音楽番組。","trivia":"テレビ初披露と案内された楽曲があります。","url":"https://mrsgreenapple.com/news/detail/23268"},{"id":"there","name":"THERE TOKYO","category":"スポーツ・映画","kind":"意外な発見","date":"2026-12-19","end":"2026-12-19","time":"14:00〜17:00（13:00開場）","place":"TOKYO NODE HALL（虎ノ門ヒルズ）","access":"招待制。応募条件・残席は公式サイトで要確認","why":"アスリートの競技外の物語を映像で知る、新しい切り口のイベント。","trivia":"フェンシング、トレイルランニング、パラ水泳の選手を題材にした映像作品を紹介。","url":"https://seeyouthere.jp/"},{"id":"anime","name":"『おねがい☆ティーチャー』新作映像上映会","category":"アニメ・文化","kind":"意外な発見","date":"2026-10-31","end":"2026-10-31","time":"12:30〜、13:30〜、14:30〜、15:30〜","place":"大町市平公民館（長野県）","access":"各回チケット制、席数限定","why":"作品と舞台になった地域のつながりを楽しむファン向けイベント。","trivia":"クラウドファンディングによる新作映像の上映会。","url":"https://prtimes.jp/main/html/rd/p/000000293.000012425.html"}];const now=new Intl.DateTimeFormat("sv-SE",{timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());const upcoming=data.filter(e=>e.end>=now).sort((a,b)=>a.date.localeCompare(b.date));const key="event-rader-favorites-v01";let fav=new Set();try{fav=new Set(JSON.parse(localStorage.getItem(key)||"[]"))}catch{}let mode="all";let discovery=null;const $=id=>document.getElementById(id),fmt=s=>{const [y,m,d]=s.split("-").map(Number);return y+"年"+m+"月"+d+"日（"+"日月火水木金土"[new Date(y,m-1,d).getDay()]+"）"},safe=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const cats=[...new Set(upcoming.map(e=>e.category))];$("category").innerHTML='<option value="">すべて</option>'+cats.map(c=>'<option>'+safe(c)+'</option>').join("");function render(){$("all").classList.toggle("active",mode==="all");$("fav").classList.toggle("active",mode==="fav");$("news").classList.toggle("active",mode==="news");$("filterArea").hidden=mode==="news";$("heading").textContent=mode==="news"?"新着の発見候補":mode==="fav"?"お気に入り":"これからのイベント";$("listHint").textContent=mode==="news"?"ニュース記事から見つけた未確認候補です。掲載イベントではなく、記事公開日と開催日は異なります。":"開催日順・掲載前の検証用データ";if(mode==="news"){const d=discovery;const allList=d?.items||[];const list=allList.filter(e=>!e.status||e.status==="推薦候補"||e.status==="要確認");const counts=d?.classification_counts||allList.reduce((a,e)=>{const s=e.status||"要確認";a[s]=(a[s]||0)+1;return a},{});$("cards").innerHTML=!d?'<div class="empty">ニュース候補を読み込んでいます。</div>':list.length?list.map(e=>'<article class="card"><div class="top"><span class="pill">'+safe(e.status||"要確認")+'</span><span class="warn">'+safe(e.source)+'</span></div><h3>'+safe(e.title)+'</h3><p class="warn">分類理由: '+safe(e.classification_reason||"旧形式データのため追加確認が必要です")+'<br>開催日時・日本での視聴/参加方法は未確認です。</p><a class="link" href="'+safe(e.url)+'" target="_blank" rel="noopener noreferrer">元の記事を確認 ↗</a></article>').join(""):'<div class="empty">まだ収集した候補がありません。初回の定期収集後に表示されます。</div>';if(d)$("cards").insertAdjacentHTML("afterbegin",'<p class="warn">分類件数: 推薦候補 '+(counts["推薦候補"]||0)+'件 / 要確認 '+(counts["要確認"]||0)+'件 / 対象外 '+(counts["対象外"]||0)+'件（対象外は非表示）</p>');if(d?.updated_at)$("cards").insertAdjacentHTML("afterbegin",'<p class="warn">最終取得: '+safe(d.updated_at.replace("T"," ").slice(0,16))+' UTC（記事公開日時はイベント開催日ではありません）</p>');return}const arr=upcoming.filter(e=>(mode==="all"||fav.has(e.id))&&(!$("category").value||e.category===$("category").value));$("cards").innerHTML=arr.length?arr.map(e=>'<article class="card"><div class="top"><span class="pill">'+safe(e.kind)+'</span><button class="heart '+(fav.has(e.id)?"on":"")+'" data-heart="'+e.id+'" aria-label="お気に入り">'+(fav.has(e.id)?"♥":"♡")+'</button></div><div class="date">'+fmt(e.date)+'</div><h3>'+safe(e.name)+'</h3><p>'+safe(e.why)+'</p><a href="#" class="link" data-open="'+e.id+'">詳しく見る ›</a></article>').join(""):'<div class="empty">表示するイベントがありません。お気に入りはカードの♡から登録できます。</div>'}function open(id){const e=upcoming.find(x=>x.id===id);if(!e)return;$("detail").innerHTML='<span class="pill">'+safe(e.kind)+'</span><h2>'+safe(e.name)+'</h2>'+[['開催日',fmt(e.date)+(e.end!==e.date?" 〜 "+fmt(e.end):"")],['開始・終了時刻',e.time],['場所・放送',e.place],['参加・視聴方法',e.access],['注目する理由',e.why],['知っておきたいこと',e.trivia]].map(([a,b])=>'<div class="detail"><b>'+a+'</b>'+safe(b)+'</div>').join("")+'<p><a class="link" href="'+safe(e.url)+'" target="_blank" rel="noopener noreferrer">公式情報を確認 ↗</a></p><p class="warn">2026年10月23日確認の掲載候補です。最新条件は公式サイトで再確認してください。</p>';$("dialog").showModal()}$("cards").addEventListener("click",e=>{const h=e.target.closest("[data-heart]");if(h){fav.has(h.dataset.heart)?fav.delete(h.dataset.heart):fav.add(h.dataset.heart);try{localStorage.setItem(key,JSON.stringify([...fav]))}catch{}render();return}const a=e.target.closest("[data-open]");if(a){e.preventDefault();open(a.dataset.open)}});$("all").onclick=()=>{mode="all";render()};$("fav").onclick=()=>{mode="fav";render()};$("news").onclick=()=>{mode="news";render()};$("category").onchange=render;$("close").onclick=()=>$("dialog").close();$("dialog").onclick=e=>{if(e.target===$("dialog"))$("dialog").close()};render();fetch("./data/discovery.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("not available");return r.json()}).then(j=>{if(j&&Array.isArray(j.items))discovery=j;if(mode==="news")render()}).catch(()=>{discovery={items:[],updated_at:null};if(mode==="news")render()})})();
</script></body></html>
