name: Verify EVENT RADAR candidate logic
on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Live film source extraction diagnostics (non-publishing)
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          from collect_official_films import collect
          from collect_official_films import fetch_html, SOURCES
          page = fetch_html(SOURCES[0][1])
          for term in ("SUKIYAKI", "2026年12月25日", "2026年12月11日"):
              i = page.find(term)
              print("TOHO_HTML_DIAGNOSTIC", term, "index", i, "context", repr(page[max(0,i-130):i+170] if i>=0 else "NOT FOUND"))
          import json
          from pathlib import Path
          manual = json.loads(Path("data/official_schedule_sources.json").read_text())
          result = collect(manual=manual)
          for source in result["source_reports"]:
              print("FILM_SOURCE", source)
          for event in result["items"][:15]:
              print("FILM_CANDIDATE", event["date"], event["name"], "publishable=", event["publishable"])
          print("FILM_CANDIDATE_COUNT", len(result["items"]))
          PY
      - name: Python syntax check
        run: python3 -m compileall -q scripts tests
