name: Verify EVENT RADAR candidate logic
on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Live film source extraction diagnostics (non-publishing)
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          from collect_official_films import collect
          result = collect()
          for source in result["source_reports"]:
              print("FILM_SOURCE", source)
          for event in result["items"][:15]:
              print("FILM_CANDIDATE", event["date"], event["name"], "publishable=", event["publishable"])
          print("FILM_CANDIDATE_COUNT", len(result["items"]))
          PY
      - name: Python syntax check
        run: python3 -m compileall -q scripts tests
