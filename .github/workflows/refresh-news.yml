name: Refresh EVENT RADAR news leads
on:
  workflow_dispatch:
  schedule:
    - cron: '17 0 * * *'
permissions:
  contents: write
concurrency:
  group: event-radar-news
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect RSS metadata
        run: python3 scripts/collect_news.py
      - name: Build verification queue
        run: python3 scripts/build_review_queue.py
      - name: Collect official schedule leads
        run: python3 scripts/collect_official_schedules.py
      - name: Collect official Japanese theatrical release candidates
        run: python3 scripts/collect_official_films.py
      - name: Build official schedule pilot
        run: python3 scripts/build_official_schedule.py
      - name: Test verification rules
        run: python3 -m unittest discover -s tests -v
      - name: Commit changed metadata
        run: |
          git add data/discovery.json data/review_queue.json data/official_schedule.json data/official_discovery.json data/official_film_discovery.json
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Update EVENT RADAR news leads"
            git push
          fi
