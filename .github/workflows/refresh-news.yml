name: Refresh EVENT RADAR news leads
on:
  workflow_dispatch:
  schedule:
    - cron: '17 0 * * *'
permissions:
  contents: write
concurrency:
  group: event-radar-news
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect RSS metadata
        run: python3 scripts/collect_news.py
      - name: Commit changed metadata
        run: |
          git add data/discovery.json
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Update EVENT RADAR news leads"
            git push
          fi
